# PostgreSQL 18 server configuration.
#
# Mounted read-only at /etc/postgresql/postgresql.conf and selected with
# "postgres -c config_file=...". Applying a change is a container restart:
#   docker compose restart postgres
#
# PGDATA/postgresql.auto.conf is still read after this file, so ALTER SYSTEM
# overrides anything here until ALTER SYSTEM ... RESET.

# --- File locations ----------------------------------------------------------
# A config file outside the data directory has to name the data directory and
# the auth files explicitly. Without hba_file, PostgreSQL looks for
# pg_hba.conf next to this file, where there is none, and refuses to start.
data_directory = '/var/lib/postgresql/18/docker'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/var/lib/postgresql/18/docker/pg_ident.conf'

# --- Connections -------------------------------------------------------------
# The image's own postgresql.conf.sample sets this; a custom config file has to
# repeat it, or the server only answers on loopback inside the container and no
# client on the bridge network can reach it.
listen_addresses = '*'
port = 5432
# Stated rather than left to the compiled-in default, because pgbackrest's
# pg1-socket-path has to name the same directory.
unix_socket_directories = '/var/run/postgresql'
max_connections = 100
password_encryption = scram-sha-256

# Certificates are provisioned on the host and mounted read-only.
# pg_hba.conf enforces TLS for application TCP connections.
ssl = on
ssl_cert_file = '/etc/postgresql/tls/fullchain.pem'
ssl_key_file = '/etc/postgresql/tls/privkey.pem'
ssl_min_protocol_version = 'TLSv1.2'
include = '/etc/postgresql/auth.conf'

# --- Memory ------------------------------------------------------------------
# Sized against the container's mem_limit (PG_MEM_LIMIT in .env), not host RAM.
# The cgroup limit is the real ceiling, and PostgreSQL cannot see it.
# Changing PG_MEM_LIMIT means changing these four values in the same commit.
#
#   shared_buffers       25% of the limit
#   effective_cache_size 75% of the limit (a planner hint, allocates nothing)
#   work_mem             per sort or hash node, so a single query with several
#                        of them across several parallel workers can multiply it
#   maintenance_work_mem VACUUM, CREATE INDEX, ALTER TABLE
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 32MB
maintenance_work_mem = 512MB

# Explicit huge pages, which are unrelated to transparent huge pages and are
# what the PostgreSQL documentation recommends. "try" falls back to normal pages
# when the host has none reserved, so this is safe before the sysctl step in the
# README and takes effect after it.
huge_pages = try

# --- Storage and I/O ---------------------------------------------------------
# Default 4.0 assumes a seek on spinning media. Correct for SSD; raise it back
# towards 4.0 on rotational storage.
random_page_cost = 1.1

# effective_io_concurrency and maintenance_io_concurrency both default to 16 in
# PostgreSQL 18, which already suits SSD. Left at the default.

# Asynchronous I/O, new in 18. io_uring is faster on paper but needs syscalls
# that container seccomp profiles restrict, so "worker" is the safe default here.
# io_workers defaults to 3, which is low for modern core counts. Current guidance
# is roughly a quarter of the host's cores. The value below assumes 8; scale it
# with `nproc`.
io_method = worker
io_workers = 4

# --- WAL, checkpoints, archiving ---------------------------------------------
# replica is the 18 default and the minimum pgBackRest requires. Raising it to
# logical for CDC or logical replication is this line plus a restart.
wal_level = replica
wal_compression = lz4
max_wal_size = 4GB
min_wal_size = 1GB

# Default 5min. Spacing checkpoints further apart means fewer full-page writes
# of the same page, which cuts both WAL volume and archive volume.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# A failing archive_command is retried indefinitely and WAL is retained until it
# succeeds, so a broken archive fills pg_wal rather than breaking the recovery
# chain. See the monitoring query in the README.
archive_mode = on
archive_command = 'pgbackrest --stanza=main archive-push %p'

# Caps how stale the archive can get on an idle database: an incomplete segment
# is closed and shipped after this long, bounding the PITR gap to a minute.
archive_timeout = 60s

# --- Autovacuum --------------------------------------------------------------
# Left at defaults. Autovacuum aggressiveness is a per-table property, better
# set with ALTER TABLE ... SET (autovacuum_vacuum_scale_factor = ...) on the few
# tables that need it than globally.

# --- Observability -----------------------------------------------------------
# Requires a restart to add, so it is set from the start. Read it with
# CREATE EXTENSION pg_stat_statements, which init.sh does.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top

# Without track_io_timing the block read and write times in pg_stat_statements
# and EXPLAIN (ANALYZE, BUFFERS) are always zero.
track_io_timing = on
track_wal_io_timing = on
track_functions = pl

log_destination = 'stderr'
logging_collector = off        # Docker captures stderr; see the json-file limits
log_line_prefix = '%m [%p] %q%u@%d %a '
log_min_duration_statement = 1000
log_checkpoints = on
# PostgreSQL 18 changed log_connections from a boolean to a comma-separated
# list of aspects (receipt, authentication, authorization, setup_durations,
# all). '' disables it; 'authorization' is the one worth turning on to see who
# connected from where.
log_connections = ''
log_disconnections = off
log_lock_waits = on
log_temp_files = 0             # 0 logs every temp file, which flags work_mem
log_autovacuum_min_duration = 0
log_timezone = 'UTC'

# --- Locale and formatting ---------------------------------------------------
# Collation and ctype come from initdb (builtin C.UTF-8) and are not settable
# here. These four are.
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
